name: Format

on:
  workflow_dispatch: {}
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  dotnet-format:
    name: dotnet format
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68  # v6.0.0
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore VoiceLocalCli.slnx

      - name: dotnet format --verify-no-changes
        # --severity warn (not info): matches the enforced bar, EnforceCodeStyleInBuild
        # already fails the build on analyzer-visible violations; gating on info-level
        # suggestions here would be stricter than the build itself.
        run: dotnet format VoiceLocalCli.slnx --verify-no-changes --severity warn

  ruff-format:
    name: ruff format
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/engine
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install ruff
        run: pip install -e ".[dev]"

      - name: ruff format --check
        run: ruff format --check .
