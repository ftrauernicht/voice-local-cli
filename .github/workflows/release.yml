name: Release

# Builds and publishes a Velopack release whenever a vX.Y.Z tag is pushed -- see
# docs/adr/0004-velopack-for-auto-updates.md for why Velopack over a bespoke updater,
# winget, or MSIX. Bundles the Python engine source and the PowerShell scripts alongside
# the exe (not the built venv -- see RepositoryLayout.EngineVenvRoot's doc comment in the
# .NET project for why that stays outside this package) so an installed copy can bootstrap
# itself; see docs/MANUAL_VERIFICATION.md for what's confirmed from a real install.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build, pack, and publish the Windows release
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Determine the version from the tag
        id: version
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}" -replace '^v', ''
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Publish a self-contained single-file win-x64 build
        run: >
          dotnet publish src/Cli/VoiceLocalCli.Ui.Console -c Release -r win-x64
          --self-contained -p:PublishSingleFile=true
          -p:Version=${{ steps.version.outputs.version }}
          -o publish

      - name: Bundle the Python engine source, scripts, and per-mode icons
        # Source only, never the built venv -- that's multi-hundred-MB and has to be
        # pip-installed on the target machine regardless (platform/CPU/GPU-specific
        # wheels), exactly like scripts/Setup.ps1 already does for a source checkout. The
        # installed orchestrator runs that same script against this bundled copy on first
        # run -- see RepositoryLayout.FindEngineRoot/FindScriptsRoot's doc comments.
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path publish/engine, publish/scripts, publish/Assets/icons | Out-Null
          Copy-Item src/engine/*.py, src/engine/pyproject.toml -Destination publish/engine
          Copy-Item scripts/*.ps1 -Destination publish/scripts
          Copy-Item src/Cli/VoiceLocalCli.Ui.Console/Assets/icons/*.ico -Destination publish/Assets/icons

      - name: Install the Velopack CLI (vpk)
        run: dotnet tool install -g vpk

      - name: Pack the Velopack release
        run: >
          vpk pack --packId VoiceLocalCli --packVersion ${{ steps.version.outputs.version }}
          --packDir publish --mainExe VoiceLocalCli.exe --packTitle voice-local-cli
          --packAuthors "Frank Trauernicht" --outputDir releases
          --icon src/Cli/VoiceLocalCli.Ui.Console/Assets/icons/app.ico

      - name: Upload to GitHub Releases
        run: >
          vpk upload github --repoUrl https://github.com/ftrauernicht/voice-local-cli
          --token ${{ secrets.GITHUB_TOKEN }} --outputDir releases
          --tag ${{ github.ref_name }} --publish
