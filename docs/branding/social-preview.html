<!--
  Source for social-preview.png (1280x640, GitHub's social preview image size).
  Matches the style already established on dotnet-architecture-hexagonal-template's own
  social preview (serif heading on cream, terracotta underline accent, muted sans-serif
  subtitle/topics row, divider plus name/role footer): see docs/adr/ for why this repo
  follows that repo's conventions.

  Regenerate: open this file in a browser at (or resize the window to) 1280x640, screenshot
  the page, and if the capture isn't natively 1280x640 (Chrome/the screenshot tool may
  apply its own scale factor), crop to the page's actual rendered size first, then resize
  to exactly 1280x640: done this way on 2026-10-09 because the capture came back at a
  consistent 0.90625 scale of the CSS pixel size, not 1:1.

  GitHub does not expose a way to set a repository's social preview image via the API;
  it's a Settings, General, Social preview upload, web-UI only, and (confirmed directly,
  2026-10-09) not even offered there for a private repository. Upload this PNG by hand
  once the repo is public, or once you want to confirm it looks right before then.
-->

</head>
<body>

</html>
